name: CI

on:
  push:
    branches: [main, develop]
    # Documentation-only commits do not need a full verify run. Keeping them out
    # of CI avoids a burst of red checks (and failure notifications) for changes
    # that cannot affect the build.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitattributes'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitattributes'

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, test, build
        run: npm run verify

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: CyberScape-build
          path: |
            client/dist
            server/dist
            shared/dist
          retention-days: 7
